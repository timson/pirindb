apiVersion: v1
kind: Namespace
metadata:
  name: pirindb-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pirindb-operator
  namespace: pirindb-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pirindb-operator
rules:
  - apiGroups: ["pirindb.timson.dev"]
    resources: ["pirindbclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["pirindb.timson.dev"]
    resources: ["pirindbclusters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["pirindb.timson.dev"]
    resources: ["pirindbclusters/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pirindb-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pirindb-operator
subjects:
  - kind: ServiceAccount
    name: pirindb-operator
    namespace: pirindb-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pirindb-operator
  namespace: pirindb-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pirindb-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pirindb-operator
    spec:
      serviceAccountName: pirindb-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/timson/pirindb-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
